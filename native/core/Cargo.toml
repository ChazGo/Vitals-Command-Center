[package]
name = "vitals-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local Windows backend for the native Vitals Google Health dashboard"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5"
zeroize = "1"

[profile.release]
strip = true
lto = "thin"
